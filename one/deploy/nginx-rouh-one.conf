    # --- the one program (task 30, step 10), added inside the Rouh site's
    # --- server block for port 443. The program answers only on 127.0.0.1.

    # The runs' hooks come from this machine only, straight to the program.
    # They are never served from outside, and the program refuses any that
    # arrive through a proxy as well.
    location = /one/hook { return 404; }

    location = /one { return 301 /one/; }

    # The one page (D47): exactly /one/ is Rouh's page, with the runs and
    # their terminals, the voice and the orb. Every address under /one/ is
    # still the program's. If Rouh does not answer, /one/ is the program's
    # own page of runs instead, so the runs can always be seen and stopped.
    location = /one/ {
        proxy_pass http://127.0.0.1:8021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @one_runs;
    }

    location @one_runs {
        rewrite ^ /one/ break;
        proxy_pass http://127.0.0.1:8031;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /one/ {
        proxy_pass http://127.0.0.1:8031;
        proxy_http_version 1.1;
        # A file dropped on a run's terminal is posted here, up to 20 MB (D52).
        # nginx's own default is 1 MB, which would refuse a screenshot before
        # the program ever saw it. The server block says 25M too; this says it
        # where the upload is, so an edit up there cannot break the drop.
        client_max_body_size 25m;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # --- end of the one program
