[pytest]
# pytest-asyncio is not used here: every test in this folder runs its own loop
# through `go()`. When the plugin happens to be installed anyway - .venv-e2e
# holds every suite's requirements at once - it warns at each start about a
# default it has not been told. Turning it off says the true thing and is
# harmless in a venv that does not have it.
addopts = -p no:asyncio
