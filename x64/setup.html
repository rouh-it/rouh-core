<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connected Rouh or Independent Rouh</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230b0d10'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%235ec2ff'/%3E%3C/svg%3E">

<style>
 *{box-sizing:border-box}
 [hidden]{display:none!important}
 body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d10;color:#e8ecf1;
      font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
 main{display:grid;gap:12px;width:min(90vw,340px);padding:24px 0}
 form{display:grid;gap:12px}
 .head{display:flex;align-items:center;gap:10px;margin-bottom:2px}
 .dot{width:12px;height:12px;border-radius:50%;background:#5ec2ff;
      box-shadow:0 0 14px rgba(94,194,255,.55)}
 h1{font-size:22px;margin:0;font-weight:600;letter-spacing:-.01em}
 h2{font-size:17px;margin:4px 0 0;font-weight:600}
 p{margin:0;color:#8b95a3;font-size:14px}
 strong{color:#e8ecf1;font-weight:600}
 a{color:#8fb8ff;text-decoration:none}
 a:hover{text-decoration:underline}
 a:focus-visible{outline:2px solid #4c8dff;outline-offset:2px;border-radius:3px}
 .bad,.good{border-radius:9px;padding:9px 12px}
 .bad{color:#ff8b8b;background:rgba(255,139,139,.08);border:1px solid rgba(255,139,139,.25)}
 .good{color:#8fe0aa;background:rgba(143,224,170,.08);border:1px solid rgba(143,224,170,.25)}
 div.bad{display:grid;gap:4px}
 div.bad p{color:inherit}
 .field{display:grid;gap:5px}
 label{font-size:13px;color:#8b95a3}
 /* The sign-in form: "Forgot password?" is drawn at the end of the Password
    label's row but written after Sign in, so the keyboard reaches it last.
    The form is two columns, the password field lets its label and input
    into it, and the link takes the label's row; every other child spans both. */
 form.login{grid-template-columns:1fr auto;column-gap:10px}
 form.login>*{grid-column:1/-1}
 .field-with-link{display:contents}
 .field-with-link label{grid-column:1;align-self:baseline;justify-self:start}
 .field-with-link input{grid-column:1/-1;margin-top:-7px}
 form.login>.field-link{grid-column:2;grid-row:2;align-self:baseline;font-size:13px}
 input{padding:12px 14px;border-radius:10px;border:1px solid #232a33;background:#11151a;
        color:#e8ecf1;font-size:16px;width:100%}
 input:focus{outline:2px solid #4c8dff;outline-offset:1px}
 button,.button{display:block;text-align:center;padding:12px;border-radius:10px;border:0;
         background:#4c8dff;color:#04070c;font-weight:600;font-size:15px;cursor:pointer;
         margin-top:4px;text-decoration:none;font-family:inherit;line-height:1.15}
 button:hover,.button:hover{background:#6ba0ff;text-decoration:none}
 .back{font-size:14px;text-align:center;margin-top:2px}
 .or{display:flex;align-items:center;gap:10px;color:#5d6674;font-size:12px;margin:6px 0 0}
 .or::before,.or::after{content:"";flex:1;height:1px;background:#232a33}
 details.quiet{border-top:1px solid #232a33;padding-top:10px;display:grid;gap:10px}
 details.quiet summary{cursor:pointer;color:#8fb8ff;font-size:14px}
 details.quiet[open]{gap:12px}
 details.quiet>*+*{margin-top:10px}
 button.second{background:#11151a;color:#e8ecf1;border:1px solid #2b333d}
 button.second:hover{background:#171c22}
 .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
 .missing{color:#ff8b8b;font-size:13px}
 input[aria-invalid="true"]{border-color:rgba(255,139,139,.6)}
 /* The rules under a new password (`password_rules.html`): shown before anything
    is typed, each red with a cross until it is met, then green with a tick, live
    as the person types (Petar, 8 November 2026, task 176). */
 .checks{list-style:none;margin:3px 0 0;padding:0;display:grid;gap:4px;font-size:13px;
         line-height:1.35;color:#8b95a3}
 .checks li{display:flex;align-items:flex-start;gap:8px;transition:color .12s}
 .checks .tick{flex:none;width:15px;height:15px;margin-top:1px;border-radius:50%;
         border:1.5px solid #3a4450;display:grid;place-items:center;
         font-size:10px;font-weight:700;line-height:1;color:#04070c}
 .checks li.met{color:#8fe0aa}
 .checks li.met .tick{background:#8fe0aa;border-color:#8fe0aa}
 .checks li.met .tick::before{content:"";width:6px;height:3px;margin-top:-2px;border:solid #04070c;
         border-width:0 0 2px 2px;transform:rotate(-45deg)}
 .checks li.open{color:#ff8b8b}
 .checks li.open .tick{border-color:#ff8b8b;color:#ff8b8b}
 .checks li.open .tick::before{content:"\00d7";font-size:12px}
 code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:#11151a;border:1px solid #232a33;
       border-radius:6px;padding:6px 8px;display:block;overflow-wrap:anywhere;color:#e8ecf1}
 .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);
     white-space:nowrap}
</style>
<main class="wide">
 <div class="head"><span class="dot" aria-hidden="true"></span><h1>Rouh</h1></div>
 
 <style>
  /* The Rouh's own name, orange on every screen once it has one (Petar, 8 November 2026): a
     colour no button, link or state uses here. */
  :root{--rn:#ff9a4d}
  main{width:min(calc(100vw - 32px),440px)}
  main.wide{width:min(calc(100vw - 32px),860px)}
  .rn,.bigname b.rn,.note b .rn{color:var(--rn)}
  /* Connected or Independent: two cards of one size and one shape. Connected is on the left (first
     on a phone) and the primary choice, with the accent border and a filled button; Independent is
     the quieter second (Petar, 9 November 2026: "let connected be on the left and in different
     color button and border. Should be the primary choice."). */
  .kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px;margin:6px 0 0}
  .kinds form{display:contents}
  .kind{display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;text-align:left;margin:0;padding:18px;
        border-radius:14px;border:1.5px solid #2b333d;background:#11151a;color:#e8ecf1;font-weight:400;
        font-size:14px;line-height:1.45;cursor:pointer}
  .kind:hover{background:#151a21;border-color:#4c8dff}
  .kind:focus-visible{outline:2px solid #4c8dff;outline-offset:2px}
  .kind.was:not(.primary){border-color:#8b95a3}
  .kind .k-name{font-size:18px;font-weight:650;color:#e8ecf1}
  .kind .k-what{color:#c5ccd6}
  .kind .k-list{display:grid;gap:6px;color:#c5ccd6;align-content:start}
  .kind .k-list>span{display:grid;grid-template-columns:16px 1fr;gap:8px}
  .kind .k-list>span>span{display:block}
  .kind .k-list svg{margin-top:3px}
  .kind .k-list b{color:#e8ecf1;font-weight:600}
  .kind .k-go{display:block;text-align:center;padding:12px;border-radius:10px;border:1px solid #4c8dff;
        color:#8fb8ff;font-weight:600;font-size:15px}
  .kind:hover .k-go{background:rgba(76,141,255,.12)}
  .kind.primary{border-color:#4c8dff;background:#121a26}
  .kind.primary:hover{background:#15203a}
  .kind.primary .k-go{background:#4c8dff;color:#04070c}
  .kind.primary:hover .k-go{background:#6ba0ff}
  .kind:not(.primary) .k-go{border-color:#3a4450;color:#c5ccd6}
  .kind:not(.primary):hover .k-go{background:#171c22;color:#e8ecf1}
  .either{color:#8b95a3;font-size:13px}
  .stays{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start}
  .stays svg{margin-top:2px;color:#8fb8ff}
  /* The key screen: the box on the left, the steps on the right, stacked on a narrow screen. */
  .keycols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px;align-items:start}
  .keycols>section{display:grid;gap:12px;min-width:0}
  .keycols h3{font-size:15px;margin:0;font-weight:600;color:#e8ecf1}
  @media (max-width:760px){.keycols{grid-template-columns:minmax(0,1fr)}}
  [hidden]{display:none!important}
  .dots{display:flex;gap:6px;margin:2px 0 4px}
  .dots i{width:22px;height:4px;border-radius:2px;background:#232a33}
  .dots i.on{background:#5ec2ff}
  h2{font-size:21px;margin:2px 0 0;line-height:1.25}
  p.lead{color:#c5ccd6;font-size:15px}
  .small{font-size:13px;color:#8b95a3}
  .field .missing{margin:0}
  .ghost{background:none;color:#8fb8ff;font-weight:500;font-size:14px;padding:8px;margin-top:0}
  .ghost:hover{background:none;text-decoration:underline}
  .choice{border:1.5px solid #4c8dff;border-radius:12px;padding:12px 14px;background:rgba(76,141,255,.07)}
  .choice b{color:#e8ecf1;font-size:15px}
  .choice ul{margin:6px 0 0;padding-left:18px;color:#c5ccd6;font-size:14px;display:grid;gap:2px}
  .note{border-radius:12px;padding:12px 14px;background:#11151a;border:1px solid #232a33;
        color:#c5ccd6;font-size:14px}
  .note b{color:#e8ecf1}
  /* The born screen's three facts, each a plain line (Petar, 9 November 2026): no box. */
  .facts{margin:2px 0 4px;display:grid;gap:6px}
  .facts>div{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px}
  .facts dt{color:#8b95a3;font-size:15px}
  .facts dd{margin:0;color:#e8ecf1;font-size:15px;min-width:0;overflow-wrap:anywhere}
  .facts dd.nm{font-size:22px;font-weight:650;line-height:1.25;color:var(--rn)}
  .facts .host{color:#8fb8ff;text-decoration:underline;text-underline-offset:3px}
  .facts .soon{color:#8b95a3}
  /* Check your email: the code box, wide digits; Resend, Change and Independent quieter. */
  .to{overflow-wrap:anywhere;color:#e8ecf1;font-weight:600}
  input.code{font:600 24px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3em;text-align:center;padding:12px 8px}
  input.code::placeholder{color:#3a4450}
  details.change{border-top:1px solid #232a33;padding-top:4px}
  details.change summary{cursor:pointer;color:#8fb8ff;font-size:14px;min-height:44px;display:flex;align-items:center}
  details.change form{margin-top:4px}
  .out-ind{border-top:1px solid #232a33;padding-top:4px;gap:2px}
  .out-ind button{background:none;color:#8fb8ff;font-weight:500;font-size:14px;padding:8px 0;margin:0;text-align:left;min-height:44px}
  .out-ind button:hover{background:none;text-decoration:underline}
  .out-ind p{font-size:13px}
  .info{display:inline}
  .info summary{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;
        border:1px solid #3a4450;color:#8fb8ff;font-size:12px;font-weight:700;cursor:pointer;
        list-style:none;vertical-align:-3px;margin-left:4px}
  .info summary::-webkit-details-marker{display:none}
  .info[open] summary{background:#232a33}
  .info p{margin-top:8px;color:#c5ccd6}
  .bigname{font-size:17px;color:#c5ccd6}
  .bigname b{color:#e8ecf1;font-size:22px;display:block;margin-top:2px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{position:relative;display:grid;gap:2px;padding:14px;border-radius:12px;border:1px solid #2b333d;
        background:#11151a;color:#e8ecf1;text-decoration:none;min-height:96px;align-content:start}
  .tile:hover{border-color:#4c8dff;text-decoration:none}
  .tile b{font-size:16px}
  .tile span{font-size:13px;color:#c5ccd6}
  .tile small{font-size:12px;color:#8b95a3}
  .tile.ok{border-color:rgba(143,224,170,.6)}
  .tile .ck{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;
            background:#8fe0aa;color:#04070c;display:grid;place-items:center;font-size:13px;font-weight:700}
  .tile .wait{color:#f2c86b}
  .guide{margin:0;padding-left:22px;display:grid;gap:10px;color:#c5ccd6;font-size:14px}
  .guide b{color:#e8ecf1}
  .guide i{color:#e8ecf1;font-style:normal;font-weight:600}
  .out{display:inline-block;margin-top:4px;font-size:14px}
  .checking{display:flex;gap:10px;align-items:center}
  .spin{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid #232a33;
        border-top-color:#5ec2ff;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
 </style>

<script>
/* Nobody is signed in here, so whatever this browser kept of anybody's Rouh for
   reading with no connection goes now: the sealed copy, the key it was sealed
   with, and the pages the service worker kept (app/offline.js, sw.js). This is
   what makes signing out, or a sign-in running out, take the copy with it, even
   when the page that kept it never got the chance to. */
(function () {
  try {
    if (window.indexedDB) { indexedDB.deleteDatabase('rouh-offline'); }
    if (window.caches) {
      caches.keys().then(function (names) {
        names.forEach(function (n) { if (n === 'rouh-page' || n === 'rouh-data') { caches.delete(n); } });
      });
    }
    var sw = navigator.serviceWorker && navigator.serviceWorker.controller;
    if (sw) { sw.postMessage({ type: 'rouh-forget' }); }
  } catch (e) { /* a browser with none of these kept nothing */ }
}());
</script>
