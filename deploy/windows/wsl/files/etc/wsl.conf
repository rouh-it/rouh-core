# Rouh's own WSL Linux (rouh-core deploy/windows/wsl). Read by WSL each time this Linux starts.
[boot]
# systemd starts Docker and runs the nightly update's timer, as on any Linux server.
systemd=true

[user]
default=rouh

# Locked down (186-02): no Windows drive is mounted here, and nothing in here can start a
# Windows program. Rouh's data stays on this Linux's own disk, where Linux permissions hold.
[automount]
enabled=false
mountFsTab=false

[interop]
enabled=false
appendWindowsPath=false

[network]
hostname=rouh
generateHosts=true
generateResolvConf=true
