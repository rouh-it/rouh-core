# How WSL installs this .wsl file when it is opened by itself (wsl --install --from-file).
# Rouh for Windows and install.ps1 import it with wsl --import and run the first start themselves.
[oobe]
command = /usr/local/bin/rouh-wsl first-start
defaultUid = 1000
defaultName = Rouh

[shortcut]
enabled = false

[windowsterminal]
enabled = false
