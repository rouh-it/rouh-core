<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The agent loop gaps</title>
<!--
  The status page for the ten gaps between Rouh's hand-written turn loop and
  the Claude Agent SDK.

  It draws nothing of its own. Every row, every status and every commit on this
  page comes from /api/gaps, which is rouh/gaps.json read off disk on each
  request, so the page cannot say a thing is done when the record says it is
  not. It asks again every ten seconds, which is what makes it live while work
  is going on.

  The colours are Rouh's own, said again here because this page stands alone
  and does not load app.css. Rouh is dark and only dark, so there is one set
  of them and nothing to choose between.
-->
<style>
:root {
  --bg: #0a0c10;
  --panel: #12161c;
  --panel-2: #171c24;
  --line: #232a34;
  --text: #e7ecf3;
  --dim: #8d9aac;
  --accent: #5ec2ff;
  --good: #57d9a3;
  --warn: #f2b45e;
  --bad: #ff7a70;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --radius: 14px;
  --radius-s: 9px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding: 22px 18px 48px;
}
.wrap { max-width: 980px; margin: 0 auto; }

header { margin-bottom: 20px; }
h1 {
  font-size: 21px;
  font-weight: 620;
  letter-spacing: -0.01em;
  margin: 0 0 6px;
}
.sub { color: var(--dim); margin: 0; max-width: 62ch; }

/* How much of it is actually running in production. Deployed is the only
   thing this bar counts, because it is the only status that is done. */
.tally {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
  padding: 12px 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.tally .count { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
.tally .count b { color: var(--good); font-weight: 620; }
.bar {
  flex: 1;
  height: 6px;
  border-radius: 999px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  overflow: hidden;
}
.bar i { display: block; height: 100%; background: var(--good); width: 0; transition: width .4s ease; }

/* What it has cost. Four figures, each with the question it answers under
   it, because "$1.42" on its own says nothing. */
.spend {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-top: 10px;
  padding: 12px 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.spend-fig { display: grid; gap: 2px; align-content: start; }
.spend-fig b {
  font-family: var(--mono);
  font-size: 17px;
  font-weight: 620;
  color: var(--text);
  letter-spacing: -0.01em;
}
.spend-fig span { color: var(--dim); font-size: 12px; line-height: 1.35; }
/* An explicit display beats the hidden attribute, so a block with nothing to
   say would sit there showing four dashes. Said out loud here, next to the
   rule that caused it. */
.spend[hidden] { display: none; }

ol.gaps { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 10px; }
li.gap {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: grid;
  grid-template-columns: 30px 1fr auto;
  gap: 4px 14px;
  align-items: start;
}
.num {
  grid-column: 1;
  grid-row: 1 / span 4;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--dim);
  padding-top: 2px;
}
.name {
  grid-column: 2;
  grid-row: 1;
  font-weight: 600;
  font-size: 15px;
  letter-spacing: -0.005em;
  padding-top: 1px;
}
.what { grid-column: 2 / span 2; grid-row: 2; color: var(--text); }
.why { grid-column: 2 / span 2; grid-row: 3; color: var(--dim); max-width: 88ch; }
.meta {
  grid-column: 2 / span 2;
  grid-row: 4;
  margin-top: 8px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--dim);
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
}
.meta:empty { display: none; }

/* The status, said twice: a word, and where that word sits in the six. */
.state { grid-column: 3; grid-row: 1; justify-self: end; text-align: right; }
.pill {
  display: inline-block;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .04em;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--dim);
  background: var(--panel-2);
  white-space: nowrap;
}
.pill[data-status="in progress"] { color: var(--accent); border-color: var(--accent); }
.pill[data-status="built"] { color: var(--warn); border-color: var(--warn); }
.pill[data-status="tests passing"] { color: var(--warn); border-color: var(--warn); }
.pill[data-status="merged to main"] { color: var(--accent); border-color: var(--accent); background: rgba(94,194,255,.10); }
.pill[data-status="deployed"] { color: var(--good); border-color: var(--good); background: rgba(87,217,163,.12); font-weight: 620; }

.ladder { display: flex; gap: 3px; margin-top: 7px; justify-content: flex-end; }
.ladder span {
  width: 16px;
  height: 4px;
  border-radius: 999px;
  background: var(--line);
}
.ladder span.on { background: var(--accent); }
.ladder span.done { background: var(--good); }

footer { margin-top: 22px; color: var(--dim); font-size: 12px; font-family: var(--mono); }
.trouble { color: var(--bad); }

/* On a phone there is no room for a column of statuses, so the row becomes
   two columns and the status goes under the name rather than beside it. */
@media (max-width: 620px) {
  li.gap { grid-template-columns: 24px 1fr; }
  .name { grid-row: 1; }
  .state { grid-column: 2; grid-row: 2; justify-self: start; text-align: left; margin: 4px 0 2px; }
  .what { grid-column: 2; grid-row: 3; }
  .why { grid-column: 2; grid-row: 4; }
  .meta { grid-column: 2; grid-row: 5; }
  .ladder { justify-content: flex-start; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">The agent loop gaps</h1>
    <p class="sub" id="subtitle"></p>
    <div class="tally">
      <span class="count" id="tally">loading</span>
      <span class="bar"><i id="bar"></i></span>
    </div>
    <!-- What the loop those gaps are about has actually cost. Here because
         gap 10 is about being able to see it, and a page that says how the
         work is going is the right place to see whether it made anything
         cheaper. -->
    <div class="spend" id="spend" hidden>
      <div class="spend-fig"><b id="spendToday">--</b><span>today</span></div>
      <div class="spend-fig"><b id="spendCached">--</b><span>of what was sent came out of the cache</span></div>
      <div class="spend-fig"><b id="spendTurns">--</b><span>turns today</span></div>
      <div class="spend-fig"><b id="spendAll">--</b><span>since it started counting</span></div>
    </div>
  </header>
  <ol class="gaps" id="rows"></ol>
  <footer id="foot"></footer>
</div>
<script>
(function () {
  'use strict';

  // The six, in order. A row's ladder fills up to wherever its status sits,
  // and only the last rung is green, because only the last one is done.
  var STATUSES = ['not started', 'in progress', 'built', 'tests passing',
                  'merged to main', 'deployed'];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function ladder(status) {
    var at = STATUSES.indexOf(status);
    var box = el('div', 'ladder');
    for (var i = 0; i < STATUSES.length; i++) {
      var rung = el('span');
      if (i <= at) rung.className = (status === 'deployed') ? 'done' : 'on';
      box.appendChild(rung);
    }
    return box;
  }

  function row(gap) {
    var status = gap.status || 'not started';
    var li = el('li', 'gap');
    li.setAttribute('data-gap', gap.id || '');
    li.setAttribute('data-status', status);
    li.appendChild(el('div', 'num', String(gap.number == null ? '' : gap.number)));
    li.appendChild(el('div', 'name', gap.name || gap.id || ''));

    var state = el('div', 'state');
    // Deployed is shouted, because it is the only one that means finished.
    var pill = el('span', 'pill', status === 'deployed' ? 'DEPLOYED' : status);
    pill.setAttribute('data-status', status);
    state.appendChild(pill);
    state.appendChild(ladder(status));
    li.appendChild(state);

    li.appendChild(el('div', 'what', gap.what || ''));
    li.appendChild(el('div', 'why', gap.why || ''));

    var meta = el('div', 'meta');
    if (gap.commit) meta.appendChild(el('span', 'commit', 'commit ' + gap.commit));
    if (gap.deployed) meta.appendChild(el('span', 'when', 'deployed ' + gap.deployed));
    li.appendChild(meta);
    return li;
  }

  function draw(record) {
    var gaps = (record && record.gaps) || [];
    if (record && record.title) document.getElementById('title').textContent = record.title;
    document.getElementById('subtitle').textContent = (record && record.subtitle) || '';

    var rows = document.getElementById('rows');
    rows.textContent = '';
    gaps.forEach(function (gap) { rows.appendChild(row(gap)); });

    var done = gaps.filter(function (g) { return g.status === 'deployed'; }).length;
    document.getElementById('tally').innerHTML = '';
    var count = document.getElementById('tally');
    count.appendChild(el('b', null, String(done)));
    count.appendChild(document.createTextNode(' of ' + gaps.length + ' deployed'));
    document.getElementById('bar').style.width =
      (gaps.length ? Math.round(done * 100 / gaps.length) : 0) + '%';

    var at = new Date();
    document.getElementById('foot').textContent =
      'read from rouh/gaps.json at ' + at.toTimeString().slice(0, 8);
  }

  function drawSpend(spend) {
    var box = document.getElementById('spend');
    if (!box) return;
    var today = (spend && spend.today) || null;
    var all = (spend && spend.all_time) || null;
    if (!today || !all || !all.turns) { box.hidden = true; return; }
    box.hidden = false;
    document.getElementById('spendToday').textContent = spend.said.today;
    document.getElementById('spendCached').textContent = spend.said.cached + '%';
    document.getElementById('spendTurns').textContent = String(today.turns);
    document.getElementById('spendAll').textContent =
      (all.cost > 0 || all.priced) ? moneyish(all.cost) : String(all.turns) + ' turns';
  }

  // The same rule the server uses: under a cent is said in cents, because
  // "$0.004" reads as nothing and most turns cost about that.
  function moneyish(cost) {
    if (typeof cost !== 'number' || !isFinite(cost)) return '--';
    if (cost <= 0) return '$0.00';
    if (cost < 0.01) return (cost * 100).toFixed(2) + 'c';
    if (cost < 1) return '$' + cost.toFixed(3);
    return '$' + cost.toFixed(2);
  }

  function refreshSpend() {
    fetch('/api/spend', { credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (v) { if (v && !v.error) drawSpend(v); })
      .catch(function () { /* the page is about the gaps; this is beside it */ });
  }

  function refresh() {
    refreshSpend();
    fetch('/api/gaps', { credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('the record came back ' + r.status);
        return r.json();
      })
      .then(draw)
      .catch(function (err) {
        var foot = document.getElementById('foot');
        foot.className = 'trouble';
        foot.textContent = 'the record could not be read: ' + err.message;
      });
  }

  refresh();
  // Live while work is going on. Ten seconds is often enough to watch a row
  // move and rare enough to cost nothing.
  setInterval(refresh, 10000);
})();
</script>
</body>
</html>
