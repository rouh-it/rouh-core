{% load rouh_assets %}<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="{% asset "icon-180.png" %}">
<link rel="icon" type="image/svg+xml" href="{% asset "icon.svg" %}">
<link rel="icon" type="image/png" sizes="192x192" href="{% asset "icon-192.png" %}">
<!--
  The look shared by the trusted contacts page, the approvals page and a
  case's page (`rouh/web/trusted.py`). Rouh's own colours, said again here
  because these pages stand alone and do not load app.css, the same set as
  mail_log.html. Everything drawn from an email is escaped by Django.
-->
<style>
:root {
  --bg: #0a0c10; --panel: #12161c; --panel-2: #171c24; --line: #232a34;
  --text: #e7ecf3; --dim: #8d9aac; --dimmer: #66758a;
  --accent: #5ec2ff; --accent-ink: #04121c;
  --good: #57d9a3; --warn: #f2b45e; --bad: #ff7a70;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --radius: 14px; --radius-s: 9px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding: 22px 16px 56px;
}
.wrap { max-width: 860px; margin: 0 auto; }
a { color: var(--accent); }
h1 { font-size: 21px; font-weight: 620; letter-spacing: -0.01em; margin: 0 0 6px; overflow-wrap: anywhere; }
h2 { font-size: 15px; font-weight: 620; margin: 0 0 10px; }
.sub { color: var(--dim); margin: 0; max-width: 66ch; }
.nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
.ctl, button.ctl {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; min-height: 32px;
  border: 1px solid var(--line); border-radius: var(--radius-s);
  background: transparent; color: var(--dim);
  font: inherit; font-size: 13px; text-decoration: none; cursor: pointer; white-space: nowrap;
}
.ctl:hover { color: var(--text); border-color: var(--dim); }
.ctl.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.ctl.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.ctl.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.ctl.danger:hover { color: var(--text); background: color-mix(in srgb, var(--bad) 22%, transparent); }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; margin: 0 0 12px; min-width: 0;
}
.card.warn { border-left: 3px solid var(--warn); }
.card.bad { border-left: 3px solid var(--bad); }
.card.good { border-left: 3px solid var(--good); }
.flash { margin: 0 0 12px; padding: 10px 14px; border-radius: var(--radius-s); border: 1px solid var(--line); background: var(--panel-2); overflow-wrap: anywhere; }
.flash.good { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.flash.bad { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); color: var(--text); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
.pill.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.pill.busy { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.k { display: block; color: var(--dimmer); font-size: 11.5px; margin: 0 0 2px; }
.muted { color: var(--dim); }
.small { font-size: 12.5px; }
.mono { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
pre, .body {
  margin: 4px 0 0; padding: 10px 12px;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-s);
  font-family: var(--sans); font-size: 13.5px;
  white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto;
}
ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ul.reasons { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
dl.head { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 0; font-size: 13px; }
dl.head dt { color: var(--dimmer); }
dl.head dd { margin: 0; overflow-wrap: anywhere; }
label { cursor: pointer; }
input[type=text], input[type=email], input[type=search], select, textarea {
  width: 100%; padding: 8px 10px; min-height: 36px;
  background: var(--bg); color: var(--text);
  border: 1px solid var(--line); border-radius: var(--radius-s);
  font: inherit; font-size: 14px;
}
textarea { min-height: 140px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus, .ctl:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 1px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.row.between { justify-content: space-between; }
.checks { display: grid; gap: 6px; margin: 4px 0 0; }
.check { display: flex; gap: 8px; align-items: flex-start; }
.check input { margin: 3px 0 0; flex: 0 0 auto; width: 16px; height: 16px; accent-color: var(--accent); }
.check span { min-width: 0; overflow-wrap: anywhere; }
.field { display: grid; gap: 4px; margin: 0 0 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.timeline li { display: grid; grid-template-columns: 128px 1fr; gap: 10px; font-size: 13px; }
.timeline time { color: var(--dimmer); font-size: 12px; }
details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
.empty { margin: 0; padding: 16px 14px; background: var(--panel); border: 1px dashed var(--line); border-radius: var(--radius); color: var(--dim); }
@media (max-width: 560px) {
  .timeline li { grid-template-columns: 1fr; gap: 0; }
  dl.head { grid-template-columns: 1fr; }
  dl.head dt { margin-top: 4px; }
  .actions .ctl { flex: 1 1 auto; justify-content: center; }
}
{% if not dark_only %}@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --panel-2: #eef1f5; --line: #d9dee6;
    --text: #151a21; --dim: #5a6576; --dimmer: #7b8594;
    --accent: #0a74c2; --accent-ink: #ffffff;
    --good: #16865a; --warn: #a66300; --bad: #c8372d;
    color-scheme: light;
  }
}{% endif %}
</style>
