<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img">
<rect width="960" height="540" fill="#0e1116"/>
<g font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif"><title>A question, who can see task 58, and Rouh's answer: one person who can read, one who can edit, and a public link</title><rect x="120" y="40" width="720" height="460" rx="18" fill="#161b22" stroke="#2b3340"/><rect x="460" y="72" width="340" height="52" rx="14" fill="#2a2f45"/><text x="480" y="105" font-size="17" fill="#e6edf3">Who can see 58, and is it public?</text><rect x="160" y="150" width="640" height="248" rx="12" fill="#0e1116" stroke="#2b3340"/><text x="184" y="186" font-size="18" fill="#e6edf3">Task 58, Offsite plan, is open to three:</text><text x="184" y="232" font-size="17" fill="#e6edf3">sam@example.com</text><rect x="620" y="212" width="80" height="28" rx="14" fill="none" stroke="#5cc3ff"/><text x="642" y="232" font-size="14" fill="#5cc3ff">Read</text><text x="184" y="280" font-size="17" fill="#e6edf3">lena@example.com</text><rect x="620" y="260" width="80" height="28" rx="14" fill="none" stroke="#f0b45c"/><text x="645" y="280" font-size="14" fill="#f0b45c">Edit</text><text x="184" y="328" font-size="17" fill="#e6edf3">Anyone with the link</text><rect x="620" y="308" width="80" height="28" rx="14" fill="none" stroke="#5cc3ff"/><text x="642" y="328" font-size="14" fill="#5cc3ff">Read</text><text x="184" y="374" font-size="15" fill="#8b97a6">Say who to take off, or unpublish it, and it closes at once.</text><rect x="160" y="428" width="640" height="48" rx="14" fill="#0e1116" stroke="#5cc3ff"/><text x="184" y="458" font-size="16" fill="#8b97a6">Type to Rouh</text></g></svg>
