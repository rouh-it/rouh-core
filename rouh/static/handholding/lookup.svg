<g font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif"><title>A question in the chat, and Rouh's short answer with its sources listed under it</title><rect x="120" y="40" width="720" height="460" rx="18" fill="#161b22" stroke="#2b3340"/><rect x="380" y="76" width="420" height="56" rx="14" fill="#2a2f45"/><text x="400" y="111" font-size="17" fill="#e6edf3">Look into the Oceanarium's opening hours.</text><rect x="160" y="168" width="560" height="190" rx="12" fill="#0e1116" stroke="#2b3340"/><text x="184" y="206" font-size="18" fill="#e6edf3">The Oceanarium opens every day from</text><text x="184" y="236" font-size="18" fill="#e6edf3">10:00 to 19:00; the last entry is at 18:00.</text><text x="184" y="266" font-size="18" fill="#e6edf3">On public holidays it closes at 18:00.</text><text x="184" y="318" font-size="14" fill="#8b97a6">Sources</text><text x="184" y="344" font-size="0"></text><text x="184" y="344" font-size="0"></text><text x="270" y="318" font-size="15" fill="#5cc3ff">1  oceanarium.example</text><text x="470" y="318" font-size="15" fill="#5cc3ff">2  travel.example</text><rect x="160" y="420" width="640" height="52" rx="14" fill="#0e1116" stroke="#5cc3ff"/><text x="184" y="452" font-size="16" fill="#8b97a6">Type to Rouh</text></g></svg>
