# Rouh, as one Django project, managed with uv on a pyenv Python.
#
#   pyenv install 3.12.14         # the interpreter, named in .python-version
#   uv sync                       # .venv, exactly what uv.lock says
#   uv run manage.py migrate      # the schema, in PostgreSQL
#   uv run manage.py account add alex --generate
#   ./run-local.sh                # the server, on the laptop
#
# `uv.lock` is the truth for every version below. `rouh/requirements.txt` is
# generated from it (`uv export`, the command is at the top of that file) and
# is what the server's deploy installs, because a deploy that rolls back to a
# commit from before this file existed still has to find the list it knows.
#
# Every version is pinned on purpose. An overnight build that "just works" and
# then breaks on a transitive upgrade three weeks later is not a working system.

[project]
name = "rouh"
version = "0"
description = "Rouh, the voice assistant: a Django project on PostgreSQL."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = "==3.12.*"
dependencies = [
    # The framework, on the long-term support line: security fixes until
    # April 2028, and nothing in it moves under us in the meantime.
    "django==5.2.17",
    # The websocket, Django's way: the voice, the transcript and the task list
    # travel on one socket per tab (`rouh/web/consumers.py`).
    "channels==4.3.2",
    # PostgreSQL, the database. The binary build carries its own libpq, so the
    # server needs nothing from apt to talk to its database. The pool is
    # Django's own connection pool (`rouh/project/db/base.py`, task 137).
    "psycopg[binary,pool]==3.3.6",
    "psycopg-pool==3.3.3",
    # The ASGI server systemd starts (`deploy/run-server.sh`). The [standard]
    # extras are the fast event loop and the websocket implementation.
    "uvicorn[standard]==0.34.0",
    # The model.
    "anthropic==0.116.0",
    # And the other one: OpenAI's GPT-6 Luna, which the box beside the
    # composer offers as a fourth choice beside Anthropic's three
    # (`rouh/luna.py`). Only ever asked when OPENAI_API_KEY is set.
    "openai==3.19.2",
    # Every outbound HTTP call: Google, ElevenLabs, Telegram, a picture on a card.
    "httpx==0.28.1",
    # The weekly encrypted backup to Cloudflare R2, over its S3 API (`deploy/backup_offsite.py`).
    "boto3==1.43.108",
    # The realtime speech-to-text socket (`rouh/speech.py`), a client of its own.
    "websockets==14.1",
    # Fernet, for the credentials Rouh holds on somebody else's behalf: an
    # organisation's Google client secret and every person's refresh token. AES
    # with an HMAC over the ciphertext, so a row edited by hand fails to open
    # rather than decrypting to something else.
    "cryptography==50.0.1",
    # A shared gene's Sigstore signature, checked against the build the gene registry's
    # signed index names before its files are kept (`rouh/genelab.py`). Only asked when
    # a registry gives one.
    "sigstore==4.5.0",
    # A real headless browser, for the one thing that cannot be done without
    # one: getting a YouTube transcript past the bot check (`rouh/youtube.py`).
    # A fallback, not a dependency of any ordinary turn. The browser itself is
    # installed by the deploy, not by uv. Pinned to the same version the
    # browser environment pins, because the library and the browser build have
    # to be the same age and there is one browser cache on this machine.
    "playwright==1.56.0",
    # The words in an uploaded PDF, so a search finds what is written in one
    # (`rouh/uploads.py`). Pure Python with no dependencies of its own; it
    # opens an encrypted PDF with the `cryptography` already pinned above.
    "pypdf==6.19.0",
    # The owner's own Telegram account, for the one thing a bot cannot do: make
    # a group. Each fork made on Telegram gets a group of its own, created as
    # the owner with Rouh's bot in it (`rouh/telegram_account.py`), one group
    # for each idea.
    "telethon==1.42.0",
    # Pictures, for the model to look at. A screenshot or photo from an Apple
    # device is a .heic, which the Messages API does not take, and a large
    # PNG can be over the size the API takes for one picture; both are
    # written again, at their full size, as a picture it does take
    # (`attachments.Attachments.for_model`). pillow-heif is what lets Pillow
    # open a .heic or .heif at all.
    "pillow==12.3.0",
    "pillow-heif==1.8.0",
    "segno==1.6.6",
]

[dependency-groups]
# The browser environment (`./e2e.sh`): a real Chromium driven at the real app,
# and the stand-ins for everything outside it. The stand-ins in rouh/testing/
# are small web servers of their own, pretending to be Anthropic, Google,
# ElevenLabs and Telegram, and the one program is its own service with its own
# pins (one/requirements.txt); neither is Rouh's backend, so what they need
# lives here and never reaches the server's venv.
e2e = [
    "fastapi==0.115.6",
    "python-multipart==0.0.20",
    "wsproto==1.2.0",
    "pyte==0.8.2",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-playwright==0.7.1",
    "pillow==12.3.0",
]

[tool.uv]
# An application, not a library: nothing is built or installed from this
# folder, and `uv sync` only fills the environment.
package = false
default-groups = []
