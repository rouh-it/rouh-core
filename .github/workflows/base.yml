# Rouh's base image (deploy/container/Dockerfile.base) and its protected core (guard/Dockerfile):
# tested on a pull request, merged into main only when every check passed, and built, signed and
# published from that one tagged commit of main, in GitHub's container registry:
#
#   ghcr.io/rouh-it/rouh-base:<level>, :<line>, :latest     what every Rouh runs on, no Rouh code
#   ghcr.io/rouh-it/rouh-guard:<level>, :latest             the protected core a Rouh uses and cannot edit
#
# Both packages are public, so anyone may pull them with no sign-in.
#
# Petar, 23 October 2026: "latest" means only patch-level fixes to what Rouh runs on, and they go
# in automatically; everything else reaches a Rouh as a gene. Since 24 October 2026 (task 98,
# step 98-23) a level is published as a release of format 2: the base, the protected core and
# PostgreSQL - the line's own pin, by digest - with the reference stack file
# (deploy/stack/compose.yml), the stack check's allow-list (guard/policy/stack-policy.json) and
# the newest commit of main that passed its tests (rouh.land's /mac/code/newest.json), which a new
# install starts from. There is no code image any more: a Rouh's code comes from rouh.land.
#
# The version list - which Python, Node, Codex, Playwright MCP, PostgreSQL and every Python
# library, exactly - is in main, deploy/container/base/ (base_patch.py says what each file is),
# since 30 October 2026. Until then it lived on a branch of its own, "base", and this built main's
# code with that branch's versions; that branch is kept, read-only, as
# archive/base-branch-until-2026-10. Now one commit of main holds both, and that commit is what a
# release names, with a tag, base-<level>.
#
# What starts it:
#   - a push to a branch base-patch/<level>, which the Creator Rouh's nightly patch job makes
#     (rouh/base_patches.py: base_patch.py look over main's version list, the next level
#     committed on top of main and pushed with the job's own git key). The branch may change
#     deploy/container/base/ and nothing else;
#   - by hand (Actions, Base image, Run workflow): "branch" tests a base-patch/<level> branch
#     again; "cut" makes a new line from main (level <line>.0) on a branch of its own and goes on
#     exactly as for a nightly level. This workflow starts itself the same way, with "branch",
#     when main moved on while it was checking (see merge).
#
# What it does, and in this order, so that a failure anywhere publishes nothing, merges nothing
# and leaves "latest" where it was:
#   1. prepare  the branch put on top of main as it is now, the level refused unless it is newer
#               than main's and has no tag yet, and a pull request on main opened (or brought up
#               to date) that shows every version that changes
#   2. build    on Intel and on Arm, each natively, from that one commit: the base and the
#               protected core, each checked by check-image.sh (no Rouh code in either); then the
#               whole check (guard/bin/check-base.sh: a throwaway PostgreSQL - the line's pinned
#               one - the base, the protected core, the code a new install starts from with the
#               libraries it needs in /extra, no network): the base's own parts, the headless
#               browser over MCP, the frozen security checks and the Rouh's own checks. Pushed by
#               digest only, untagged. These are the pull request's tests.
#   3. merge    only when both platforms passed: main is moved forward to exactly the commit that
#               was tested (never a merge or a squash, which would be a commit nobody tested), and
#               GitHub marks the pull request merged. If main moved on meanwhile, the branch is
#               put on top of it again and this starts once more, up to four times.
#   4. publish  that commit tagged base-<level>; the packages are checked to be pullable with no
#               sign-in; the image tags move to the digests that were checked; the release is
#               signed (the secret ROUH_MAC_STACK_SIGNING_KEY of the environment release-signing,
#               after its reviewer's yes), held to the tagged commit by
#               mac_release.py release-matches, and sent to rouh.land, whose
#               /mac/release/stable.json and /mac/release/<line>.json then name this level. Its
#               records - how the check went on each platform, what was published, the signed
#               release itself, every Debian package in the images - go on the GitHub Release
#               base-<level>, not into git.
#   5. failed   when anything before failed: the pull request stays open, says which job and step
#               failed, and is labelled "base: failed"; the run keeps it as an artifact; and the
#               ref refs/base-failed/<level> (an annotated tag object: which job and step) tells
#               the Creator Rouh's patch job, which reads git only, so that it tells Petar once.
#
# Signed in with the workflow's own GITHUB_TOKEN; no personal token anywhere. A push made with
# GITHUB_TOKEN starts no workflow, so nothing this writes starts it again by itself; where it
# must, it says so with a workflow_dispatch, which GitHub does allow.

name: Base image

on:
  push:
    branches: ['base-patch/**']
  workflow_dispatch:
    inputs:
      branch:
        description: A branch base-patch/<level> to test again (empty with cut below)
        type: string
        default: ""
      cut:
        description: Or cut a new line from main, such as 1.1
        type: string
        default: ""
      attempt:
        description: How many times main has moved on under this level (the workflow counts)
        type: string
        default: "1"

permissions:
  contents: write
  packages: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: base-image
  cancel-in-progress: false

env:
  # Rouh's public site, the one setting every address of it is made from (rouh/site.py, task 165);
  # a repository variable ROUH_SITE_URL moves it, https://rouh.land unless said (task 165).
  ROUH_SITE_URL: ${{ vars.ROUH_SITE_URL || 'https://rouh.land' }}
  PREFIX: ghcr.io/${{ github.repository_owner }}
  SOURCE: ${{ github.server_url }}/${{ github.repository }}
  BASE_DIR: deploy/container/base

jobs:
  prepare:
    name: The level and its pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
      commit: ${{ steps.read.outputs.commit }}
      line: ${{ steps.read.outputs.line }}
      level: ${{ steps.read.outputs.level }}
      code: ${{ steps.read.outputs.code }}
      postgres: ${{ steps.read.outputs.postgres }}
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - name: Which branch
        id: branch
        env:
          PUSHED: ${{ github.event_name == 'push' && github.ref_name || '' }}
          ASKED: ${{ inputs.branch }}
          CUT: ${{ inputs.cut }}
        run: |
          set -euo pipefail
          if [ -n "$CUT" ]; then
            [[ "$CUT" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "a line is two numbers, such as 1.1" >&2; exit 1; }
            branch="base-patch/$CUT.0"
          else
            branch="${PUSHED:-$ASKED}"
          fi
          [[ "$branch" =~ ^base-patch/[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a branch base-patch/<level>: '$branch'" >&2; exit 1; }
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: uv, for a cut's lock
        if: inputs.cut != ''
        run: pipx install uv==0.12.15

      - name: The branch, on top of main as it is now
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          CUT: ${{ inputs.cut }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$CUT" ]; then
            git checkout -q -B "$BRANCH" origin/main
            python3 deploy/container/base_patch.py cut --repo . --line "$CUT" --commit "$(git rev-parse HEAD)" "$BASE_DIR"
            git add -A "$BASE_DIR"
            git commit -q -m "base $CUT.0: a new line, cut from main at $(git rev-parse --short=8 HEAD)"
          else
            git fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git checkout -q -B "$BRANCH" "origin/$BRANCH"
          fi
          # A level changes the version list and nothing else.
          other="$(git diff --name-only origin/main...HEAD | grep -v "^$BASE_DIR/" || true)"
          [ -z "$other" ] || { echo "$BRANCH changes more than $BASE_DIR/: $other" >&2; exit 1; }
          [ -n "$(git diff --name-only origin/main...HEAD)" ] || { echo "$BRANCH changes nothing" >&2; exit 1; }
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase -q origin/main
          fi
          git push -q --force-with-lease origin "HEAD:refs/heads/$BRANCH"

      - name: The level, refused unless it is the next one
        id: read
        run: |
          set -euo pipefail
          l() { jq -r ".$1" "$BASE_DIR/line.json"; }
          level="$(l level)" line="$(l line)"
          was="$(git show "origin/main:$BASE_DIR/line.json" | jq -r .level)"
          # Newer than main's level, by its numbers; and never a level already tagged.
          python3 - "$was" "$level" <<'PY'
          import sys
          was, new = (tuple(int(p) for p in v.split(".")) for v in sys.argv[1:3])
          if new <= was:
              sys.exit(f"base {sys.argv[2]} is not newer than main's {sys.argv[1]}: refused")
          PY
          if git ls-remote --exit-code -q origin "refs/tags/base-$level" >/dev/null; then
            echo "base-$level is already tagged: a level is published once, never again under another commit" >&2; exit 1
          fi
          pg="$(l postgres_image)"
          [ -n "$pg" ] && [ "$pg" != null ] || { echo "the line has no pinned database image (postgres_image)" >&2; exit 1; }
          # The code a new install starts from: the newest commit of main that passed its tests, or
          # main itself while rouh.land has none yet.
          code="$(curl -fsS "$ROUH_SITE_URL/mac/code/newest.json" | jq -r '.commit // empty' || true)"
          [ -n "$code" ] || code="$(git rev-parse origin/main)"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "line=$line"
            echo "level=$level"
            echo "code=$code"
            echo "postgres=$pg"
          } >> "$GITHUB_OUTPUT"
          mkdir -p ../before
          for f in line.json requirements.txt; do git show "origin/main:$BASE_DIR/$f" > "../before/$f"; done
          {
            python3 deploy/container/base_patch.py report "$BASE_DIR"
            echo
            python3 deploy/container/base_patch.py changes ../before "$BASE_DIR"
          } > ../body.md
          cat ../body.md >> "$GITHUB_STEP_SUMMARY"

      - name: The pull request on main
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          LEVEL: ${{ steps.read.outputs.level }}
          COMMIT: ${{ steps.read.outputs.commit }}
        run: |
          set -euo pipefail
          {
            cat ../body.md
            echo
            echo "---"
            echo "Commit \`${COMMIT:0:12}\`. The tests are the Base image workflow's build and whole check on Intel and Arm:"
            echo "$SOURCE/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "It merges by itself, by moving main to exactly this commit, only when both pass; then that commit is tagged base-$LEVEL and published. If anything fails it stays open, says so here, and nothing is published."
          } > ../pr.md
          title="Base $LEVEL: $(jq -r '[.changes[] | "\(.what) \(.to)"] + (if (.security|length) > 0 then ["\(.security|length) Debian security updates"] else [] end) | join(", ")' "$BASE_DIR/plan.json" | cut -c1-200)"
          [ "$title" != "Base $LEVEL: " ] || title="Base $LEVEL"
          pr="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file ../pr.md >/dev/null
            gh pr edit "$pr" --remove-label "base: failed" >/dev/null 2>&1 || true
          elif url="$(gh pr create --base main --head "$BRANCH" --title "$title" --body-file ../pr.md 2>../pr.err)"; then
            pr="${url##*/}"
          else
            # GitHub lets a workflow open a pull request only where the organisation's and the
            # repository's Actions settings allow it ("Allow GitHub Actions to create and approve
            # pull requests"). Without it the level is still checked, merged and published the same
            # way; only the pull request is missing, and this says so on the run.
            echo "::warning title=No pull request::GitHub refused to let this workflow open one ($(tr '\n' ' ' < ../pr.err | cut -c1-200)). Turn on Settings, Actions, General, Allow GitHub Actions to create and approve pull requests, for the organisation and the repository. Base $LEVEL goes on without it: branch $BRANCH."
            pr=""
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "the pull request: ${pr:+$SOURCE/pull/$pr}${pr:-none}"
          # A try that starts again takes back the word that the last one failed.
          git push -q origin ":refs/base-failed/$LEVEL" 2>/dev/null || true

  build:
    name: Build and check ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      ARCH: ${{ matrix.arch }}
      LEVEL: ${{ needs.prepare.outputs.level }}
      LINE: ${{ needs.prepare.outputs.line }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      CODE: ${{ needs.prepare.outputs.code }}
      POSTGRES: ${{ needs.prepare.outputs.postgres }}
    steps:
      # The exact commit prepare made (COMMIT): its code and its version list are what is built,
      # and it is the commit main moves to and the release names, so everything signed is its own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: src
          persist-credentials: false

      # The code a new install starts from: the newest commit of main that passed its tests.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.code }}
          path: code
          persist-credentials: false

      - name: Make room
        run: |
          df -h / | tail -1
          if [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -lt 25 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
            df -h / | tail -1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the base, push it by digest, check it holds no Rouh code
        run: |
          set -euo pipefail
          j() { jq -r ".$1" "src/$BASE_DIR/line.json"; }
          mkdir -p digests
          docker buildx build --platform "linux/$ARCH" -f src/deploy/container/Dockerfile.base \
            --build-arg PYTHON_IMAGE="$(j python_image)" --build-arg NODE_IMAGE="$(j node_image)" \
            --build-arg CODEX_VERSION="$(j codex)" --build-arg PLAYWRIGHT_MCP_VERSION="$(j playwright_mcp)" \
            --build-arg BASE_LINE="$LINE" --build-arg BASE_LEVEL="$LEVEL" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$COMMIT" \
            --label "org.opencontainers.image.title=rouh-base" \
            --cache-from "type=registry,ref=$PREFIX/rouh-base:cache-$ARCH" \
            --cache-to "type=registry,ref=$PREFIX/rouh-base:cache-$ARCH,mode=max,image-manifest=true,oci-mediatypes=true" \
            --output "type=image,name=$PREFIX/rouh-base,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file meta-base.json src
          base="$PREFIX/rouh-base@$(jq -r '."containerimage.digest"' meta-base.json)"
          echo "$base" > "digests/base-$ARCH"
          docker pull -q "$base"
          src/deploy/container/check-image.sh "$base" base
          docker run --rm --entrypoint cat "$base" /opt/rouh-base/dpkg.txt > "digests/dpkg-$ARCH.txt"
          docker run --rm --entrypoint cat "$base" /opt/rouh-base/base.env > "digests/base-$ARCH.env"
          cat "digests/base-$ARCH.env"

      - name: Build the protected core, push it by digest, check it holds no Rouh code
        run: |
          set -euo pipefail
          docker buildx build --platform "linux/$ARCH" -f src/guard/Dockerfile \
            --build-arg PYTHON_IMAGE="$(jq -r .python_image "src/$BASE_DIR/line.json")" --build-arg GUARD_LEVEL="$LEVEL" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$COMMIT" \
            --label "org.opencontainers.image.title=rouh-guard" \
            --label "it.rouh.guard.version=$(cat src/guard/VERSION)" \
            --output "type=image,name=$PREFIX/rouh-guard,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file meta-guard.json src
          guard="$PREFIX/rouh-guard@$(jq -r '."containerimage.digest"' meta-guard.json)"
          echo "$guard" > "digests/guard-$ARCH"
          docker pull -q "$guard"
          src/deploy/container/check-image.sh "$guard" guard
          # The stack check a Linux machine runs out of this image is the one the release signs, on each platform.
          for f in policy/stack-policy.json rouh_guard/stackpolicy.py; do
            docker run --rm --network none --entrypoint cat "$guard" "/opt/rouh-guard/$f" | cmp - "src/guard/$f"
          done

      - name: The whole check, with the code a new install starts from, nothing reaching the network
        run: |
          set -euo pipefail
          base="$(cat "digests/base-$ARCH")" guard="$(cat "digests/guard-$ARCH")"
          docker volume create check-guard >/dev/null
          docker volume create check-extra >/dev/null
          docker run --rm --user 0:0 --network none -v check-guard:/out \
            --entrypoint /opt/rouh-guard/bin/rouh-guard-install "$guard" /out
          docker run --rm --user 0:0 -v check-guard:/opt/rouh-guard:ro -v check-extra:/extra -v "$PWD/code:/src:ro" \
            --entrypoint python "$base" -I /opt/rouh-guard/bin/rouh-code-install --extra-only /src
          src/guard/bin/check-base.sh --base "$base" --guard "$guard" --code-dir code --extra-volume check-extra \
            --postgres "$POSTGRES" --name "rouh-check-$ARCH" | tee "digests/check-$ARCH.log"
          grep '^ROUH-CHECK ' "digests/check-$ARCH.log" | tail -1 | cut -d' ' -f2- > "digests/check-$ARCH.json"
          { echo "### The check on $ARCH, with main at ${CODE:0:12}"; echo; echo '```'; grep -E '^(ok|FAIL|gap|[0-9]+ passed)' "digests/check-$ARCH.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          retention-days: 90
          if-no-files-found: ignore

  merge:
    name: Merge into main
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      merged: ${{ steps.ff.outputs.merged }}
    env:
      BRANCH: ${{ needs.prepare.outputs.branch }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      LEVEL: ${{ needs.prepare.outputs.level }}
      PR: ${{ needs.prepare.outputs.pr }}
      ATTEMPT: ${{ inputs.attempt || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Main moved forward to exactly the commit that was tested
        id: ff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          # A newer try of this level was pushed while this one was checked: that one goes on.
          if [ "$(git rev-parse "origin/$BRANCH")" != "$COMMIT" ]; then
            echo "$BRANCH has moved past ${COMMIT:0:12}: the newer try is checked in its own run"
            echo "merged=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Never forced: this only works while main is still where the tested commit was made on top of.
          if git push -q origin "$COMMIT:refs/heads/main"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "main is now ${COMMIT:0:12}, base $LEVEL, the commit that was tested${PR:+; pull request #$PR is merged}"
            git push -q origin ":refs/heads/$BRANCH" || true
            exit 0
          fi
          # Main moved on while this was checked. The level again on top of it, checked again.
          if [ "$ATTEMPT" -ge 4 ]; then
            echo "main moved on under base $LEVEL four times; run the Base image workflow again by hand with branch $BRANCH" >&2
            exit 1
          fi
          git fetch -q origin main
          git checkout -q -B "$BRANCH" "$COMMIT"
          git rebase -q origin/main
          git push -q --force-with-lease="refs/heads/$BRANCH:$COMMIT" origin "HEAD:refs/heads/$BRANCH"
          gh workflow run base.yml --ref main -f branch="$BRANCH" -f attempt="$((ATTEMPT + 1))"
          [ -z "$PR" ] || gh pr comment "$PR" --body "Main moved on while ${COMMIT:0:12} was checked, so the level is now on top of it ($(git rev-parse --short=12 HEAD)) and is being checked again." >/dev/null || true
          echo "merged=false" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ needs.prepare.outputs.level }}
    needs: [prepare, build, merge]
    if: needs.merge.outputs.merged == 'true'
    # The release key is in this environment only (S12, step 139-11): no other job, branch or
    # pull request can read it, and a release waits here until Petar, its required reviewer,
    # presses Approve on the run.
    environment: release-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LEVEL: ${{ needs.prepare.outputs.level }}
      LINE: ${{ needs.prepare.outputs.line }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      CODE: ${{ needs.prepare.outputs.code }}
      POSTGRES: ${{ needs.prepare.outputs.postgres }}
      PR: ${{ needs.prepare.outputs.pr }}
      TAG: base-${{ needs.prepare.outputs.level }}
    steps:
      # The exact commit that was tested, which main now is. The release names it, so the images,
      # the stack file and the stack check's allow-list it signs must all be that commit's own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: src
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refused unless it is newer than what rouh.land serves for the line
        run: |
          set -euo pipefail
          live="$(curl -fsS "$ROUH_SITE_URL/mac/release/$LINE.json" | jq -r '.payload | fromjson | .level' || true)"
          if [ -n "$live" ]; then
            python3 - "$live" "$LEVEL" <<'PY'
          import sys
          live, new = (tuple(int(p) for p in v.split(".")) for v in sys.argv[1:3])
          if new <= live:
              sys.exit(f"rouh.land already serves base {sys.argv[1]} for this line; {sys.argv[2]} is not newer: refused")
          PY
          fi
          echo "rouh.land serves ${live:-nothing} for line $LINE; $LEVEL is newer"

      - name: Anyone may pull both packages
        # A new install pulls its whole stack with no sign-in. A package made again would start out
        # private on GitHub, and every new install would then be refused it, so that is refused here.
        run: |
          set -euo pipefail
          owner="${PREFIX#ghcr.io/}"
          for kind in base guard; do
            token="$(curl -s "https://ghcr.io/token?scope=repository:$owner/rouh-$kind:pull" | jq -r '.token // empty')"
            [ -n "$token" ] && [ "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.index.v1+json' \
                "https://ghcr.io/v2/$owner/rouh-$kind/tags/list")" = 200 ] \
              || { echo "rouh-$kind cannot be pulled without a sign-in: https://github.com/orgs/$owner/packages/container/rouh-$kind/settings" >&2; exit 1; }
            echo "rouh-$kind: anyone may pull it"
          done

      - name: The commit tagged
        working-directory: src
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if got="$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)" && [ -n "$got" ]; then
            [ "$got" = "$COMMIT" ] || { echo "$TAG is already the tag of $got, not $COMMIT: refused" >&2; exit 1; }
            git fetch -q origin "refs/tags/$TAG:refs/tags/$TAG"
          else
            git tag -a "$TAG" "$COMMIT" -m "Base $LEVEL, line $LINE" -m "$(python3 deploy/container/base_patch.py report "$BASE_DIR")"
            git push -q origin "refs/tags/$TAG"
          fi
          echo "$TAG is $COMMIT"

      - name: Tag both platforms
        id: tag
        run: |
          set -euo pipefail
          for kind in base guard; do
            ref="$PREFIX/rouh-$kind"
            tags=(-t "$ref:$LEVEL" -t "$ref:latest")
            [ "$kind" = base ] && tags+=(-t "$ref:$LINE")
            docker buildx imagetools create "${tags[@]}" \
              --annotation "index:org.opencontainers.image.source=$SOURCE" \
              --annotation "index:org.opencontainers.image.version=$LEVEL" \
              --annotation "index:org.opencontainers.image.revision=$COMMIT" \
              "$(cat "digests/$kind-amd64")" "$(cat "digests/$kind-arm64")"
            index="$(docker buildx imagetools inspect "$ref:$LEVEL" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "$kind=$ref@$index" >> "$GITHUB_OUTPUT"
            echo "rouh-$kind $LEVEL: $ref@$index"
          done

      - name: The allow-list and the check signed are the protected core's own
        # The release signs src's guard/policy/stack-policy.json; the Linux machine runs the check out
        # of the guard image the release names. Both must be the same files, byte for byte: each
        # platform's image was compared as it was built; this is the tagged one, as pulled here.
        env:
          GUARD: ${{ steps.tag.outputs.guard }}
        run: |
          set -euo pipefail
          for f in policy/stack-policy.json rouh_guard/stackpolicy.py; do
            docker run --rm --network none --entrypoint cat "$GUARD" "/opt/rouh-guard/$f" | cmp - "src/guard/$f"
            echo "the same in $GUARD and the release: guard/$f"
          done
          echo "stack check $(python3 src/deploy/container/mac_release.py check-sha256 src)"

      - name: Sign the release and send it to rouh.land
        env:
          ROUH_MAC_STACK_SIGNING_KEY: ${{ secrets.ROUH_MAC_STACK_SIGNING_KEY }}
          BASE: ${{ steps.tag.outputs.base }}
          GUARD: ${{ steps.tag.outputs.guard }}
        run: |
          set -euo pipefail
          [ -n "$ROUH_MAC_STACK_SIGNING_KEY" ] || { echo "the secret ROUH_MAC_STACK_SIGNING_KEY is not set" >&2; exit 1; }
          m=src/deploy/container/mac_release.py
          newest="$(curl -fsS "$ROUH_SITE_URL/mac/code/newest.json" || echo '{}')"
          passed="" run=""
          if [ "$(jq -r '.commit // empty' <<< "$newest")" = "$CODE" ]; then
            passed="$(jq -r .passed_at <<< "$newest")" run="$(jq -r .run <<< "$newest")"
          fi
          mkdir -p records
          python3 "$m" release-sign --line "$LINE" --level "$LEVEL" --commit "$COMMIT" \
            --run "$SOURCE/actions/runs/$GITHUB_RUN_ID" --base "$BASE" --guard "$GUARD" \
            --postgres "$POSTGRES" --postgres-version "$(jq -r '.postgres_version // empty' "src/$BASE_DIR/line.json")" \
            --code-commit "$CODE" --code-run "$run" --code-passed-at "$passed" \
            --contents digests/base-arm64.env --changes "src/$BASE_DIR/plan.json" records/release.json
          unset ROUH_MAC_STACK_SIGNING_KEY
          # Nothing is published unless every part of it is the tagged commit's own: the checkout, the
          # stack file, the allow-list, the stack check and the images built from it (task 158).
          python3 "$m" release-matches records/release.json --src src --commit "$COMMIT" --tag "$TAG" \
            --base "$BASE" --guard "$GUARD" --code "$CODE"
          python3 "$m" release-publish records/release.json
          { echo '### Published'; echo; echo '```'; python3 "$m" release-status; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: The records, on the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ steps.tag.outputs.base }}
          GUARD: ${{ steps.tag.outputs.guard }}
        run: |
          set -euo pipefail
          at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" run="$SOURCE/actions/runs/$GITHUB_RUN_ID"
          cp digests/dpkg-amd64.txt digests/dpkg-arm64.txt digests/base-amd64.env digests/base-arm64.env \
             digests/check-amd64.log digests/check-arm64.log "src/$BASE_DIR/plan.json" records/
          jq -n --arg level "$LEVEL" --arg line "$LINE" --arg base "$BASE" --arg guard "$GUARD" --arg code "$CODE" \
                --arg postgres "$POSTGRES" --arg commit "$COMMIT" --arg tag "$TAG" --arg at "$at" --arg run "$run" \
                '{level: $level, line: $line, base: $base, guard: $guard, postgres: $postgres, code: $code, commit: $commit, tag: $tag, published_at: $at, run: $run}' > records/published.json
          jq -n --arg level "$LEVEL" --arg at "$at" --arg run "$run" --arg base "$BASE" \
                --slurpfile amd digests/check-amd64.json --slurpfile arm digests/check-arm64.json \
                '{level: $level, ok: true, at: $at, run: $run, base: $base, check: {amd64: $amd[0], arm64: $arm[0]}}' > records/result.json
          {
            python3 src/deploy/container/base_patch.py report "src/$BASE_DIR"
            echo
            echo "## Published"
            echo
            echo "- Commit \`$COMMIT\` of main, tagged \`$TAG\`${PR:+, from pull request #$PR}"
            echo "- \`$BASE\`"
            echo "- \`$GUARD\`"
            echo "- \`$POSTGRES\`"
            echo "- New installs start from main at \`$CODE\`"
            echo "- Signed and sent to rouh.land: $ROUH_SITE_URL/mac/release/$LINE.json"
            echo "- The run: $run"
            echo
            echo "## The check"
            echo
            for arch in amd64 arm64; do
              jq -r --arg a "$arch" '"- \($a): \(.passed) passed, \(.failed | length) failed" + (if (.gaps | length) > 0 then "; known gaps: " + (.gaps | join("; ")) else "" end)' "digests/check-$arch.json"
            done
            echo
            echo "The files below are this level's records: \`result.json\` (the check on each platform), \`published.json\`, \`release.json\` (the signed release as rouh.land serves it), \`plan.json\`, and every Debian package in each image with its \`base.env\`."
          } > records/notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest --title "Base $LEVEL" \
            --notes-file records/notes.md \
            records/result.json records/published.json records/release.json records/plan.json \
            records/dpkg-amd64.txt records/dpkg-arm64.txt records/base-amd64.env records/base-arm64.env \
            records/check-amd64.log records/check-arm64.log
          echo "the release page: $SOURCE/releases/tag/$TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          git -C src push -q origin ":refs/base-failed/$LEVEL" 2>/dev/null || true

  failed:
    name: Say what failed
    needs: [prepare, build, merge, publish]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LEVEL: ${{ needs.prepare.outputs.level }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      PR: ${{ needs.prepare.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main

      - name: On the pull request, and for the Creator Rouh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run="$SOURCE/actions/runs/$GITHUB_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" \
            --jq '[.jobs[] | select(.conclusion == "failure") | {job: .name, steps: [.steps[]? | select(.conclusion == "failure") | .name]}]' > failed.json
          cat failed.json
          words="$(jq -r 'map("\(.job): \(if (.steps | length) > 0 then (.steps | join(", ")) else "it did not finish" end)") | join("; ")' failed.json)"
          [ -n "$words" ] || words="the run did not finish"
          jq -n --arg level "${LEVEL:-unknown}" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run "$run" --slurpfile f failed.json \
                '{level: $level, ok: false, at: $at, run: $run, failed: $f[0]}' > result.json
          echo "### Base ${LEVEL:-?} failed, nothing published: $words" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR" ]; then
            gh label create "base: failed" --color B60205 --description "A base level that failed its checks: nothing was published" --force >/dev/null || true
            gh pr edit "$PR" --add-label "base: failed" >/dev/null || true
            gh pr comment "$PR" --body "Base $LEVEL failed its checks, so nothing was merged or published and every Rouh stays where it is. What failed: $words. The run: $run" >/dev/null
          fi
          if [ -n "$LEVEL" ] && [ -n "$COMMIT" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch -q origin "$COMMIT" || true
            git tag -a "failed-$LEVEL" "$COMMIT" -m "base $LEVEL failed, nothing published" -m "What failed: $words" -m "The run: $run" -m "The pull request: ${PR:+$SOURCE/pull/$PR}${PR:-$SOURCE/tree/base-patch/$LEVEL}"
            git push -q -f origin "refs/tags/failed-$LEVEL:refs/base-failed/$LEVEL"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: result
          path: result.json
          retention-days: 90
