[pytest]
# Said here for the same reason as in rouh/pytest.ini: pytest-asyncio warns
# at every start until it is. This venv can run Rouh's own suite too, so the
# plugin is installed even though nothing in this folder is asynchronous.
asyncio_default_fixture_loop_scope = function

# A failing browser test is nearly useless without a picture of the page it
# failed on, so every failure leaves a screenshot, a video and a Playwright
# trace under tests/e2e/.artifacts. Open a trace with:
#
#   .venv-e2e/bin/python -m playwright show-trace tests/e2e/.artifacts/<test>/trace.zip
#
# Nothing is kept for a test that passes.
addopts =
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=tests/e2e/.artifacts
